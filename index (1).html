<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk URL Shortener</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c1f23; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa1ab;
      --border: #2a2f38; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 180px; resize: vertical; padding: 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  select, input[type=number] {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  button {
    padding: 9px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .spacer { flex: 1; }
  progress { width: 100%; height: 8px; margin-top: 12px; }
  #status { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.orig { word-break: break-all; max-width: 360px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  a { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Bulk URL Shortener</h1>
  <p class="sub">Tempel banyak URL (satu per baris), lalu persingkat sekaligus.</p>

  <section class="card">
    <textarea id="input" placeholder="https://github.com/user/repo&#10;https://example.com/halaman-panjang?x=1&#10;# baris berawalan # diabaikan"></textarea>
    <div class="row">
      <label>Provider
        <select id="provider">
          <option value="auto">Otomatis (fallback)</option>
          <option value="isgd">is.gd</option>
          <option value="vgd">v.gd</option>
          <option value="onept">1pt</option>
        </select>
      </label>
      <label>Jeda (ms)
        <input id="delay" type="number" min="0" step="100" value="600">
      </label>
      <div class="spacer"></div>
      <button id="start" class="primary">Persingkat</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <div id="status"></div>
    <div class="hint">URL tanpa http:// atau https:// otomatis ditambah https://. URL duplikat dilewati. Mode "Otomatis" mencoba is.gd, lalu v.gd, lalu 1pt sampai ada yang berhasil.</div>
  </section>

  <section class="card" id="results" hidden>
    <div class="row" style="margin-top:0; margin-bottom:12px">
      <strong>Hasil</strong>
      <div class="spacer"></div>
      <button id="copy">Salin short URL</button>
      <button id="csv">Unduh CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>URL asli</th><th>Short URL</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const input = $("input"), provider = $("provider"), delayEl = $("delay");
  const startBtn = $("start"), stopBtn = $("stop"), bar = $("bar"), statusEl = $("status");
  const results = $("results"), rows = $("rows");

  let data = [];          // {original, short, status, error}
  let stopped = false;
  let cbCounter = 0;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function normalize(line) {
    let u = line.trim();
    if (!u || u.startsWith("#")) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function parseInput() {
    const seen = new Set(), out = [];
    for (const line of input.value.split(/\r?\n/)) {
      const u = normalize(line);
      if (u && !seen.has(u)) { seen.add(u); out.push(u); }
    }
    return out;
  }

  // JSONP: is.gd / v.gd mendukung parameter callback sehingga bebas masalah CORS.
  function shortenJsonp(endpoint, longUrl, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const name = "__shorten_cb_" + Date.now() + "_" + (cbCounter++);
      const script = document.createElement("script");
      let done = false;

      const cleanup = () => {
        done = true;
        clearTimeout(timer);
        delete window[name];
        script.remove();
      };
      const timer = setTimeout(() => { if (!done) { cleanup(); reject(new Error("timeout")); } }, timeoutMs);

      window[name] = (resp) => {
        cleanup();
        if (resp && resp.shorturl) resolve(resp.shorturl);
        else reject(new Error((resp && resp.errormessage) || "respon tidak valid"));
      };
      script.onerror = () => { if (!done) { cleanup(); reject(new Error("gagal memuat (jaringan/diblokir)")); } };
      script.src = endpoint + "?format=json&callback=" + name + "&url=" + encodeURIComponent(longUrl);
      document.head.appendChild(script);
    });
  }

  // 1pt: POST biasa (form-urlencoded, tanpa preflight). Short URL = https://1pt.co/<short>
  async function shortenOnePt(longUrl, timeoutMs = 15000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch("https://csclub.uwaterloo.ca/~phthakka/1pt-express/addURL", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ long: longUrl }),
        signal: ctrl.signal,
      });
      let json;
      try { json = await res.json(); }
      catch { throw new Error("respon bukan JSON (HTTP " + res.status + ")"); }
      if (!res.ok || !json.short) throw new Error(json.message || "HTTP " + res.status);
      return "https://1pt.co/" + json.short;
    } catch (e) {
      if (e.name === "AbortError") throw new Error("timeout");
      if (e instanceof TypeError) throw new Error("gagal memuat (jaringan/CORS)");
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  const PROVIDERS = {
    isgd:  { label: "is.gd", run: (u) => shortenJsonp("https://is.gd/create.php", u) },
    vgd:   { label: "v.gd",  run: (u) => shortenJsonp("https://v.gd/create.php", u) },
    onept: { label: "1pt",   run: shortenOnePt },
  };
  const ORDER = ["isgd", "vgd", "onept"];

  async function shortenOne(key, url, retries) {
    let lastErr;
    for (let i = 1; i <= retries; i++) {
      try { return await PROVIDERS[key].run(url); }
      catch (e) {
        lastErr = e;
        // Error validasi dari server tidak perlu di-retry
        if (!/timeout|jaringan/.test(e.message)) break;
        await sleep(1500 * i);
      }
    }
    throw lastErr;
  }

  // "auto": coba provider berurutan sampai ada yang berhasil
  async function shorten(key, url) {
    if (key !== "auto") return shortenOne(key, url, 3);
    const errs = [];
    for (const k of ORDER) {
      try { return await shortenOne(k, url, 2); }
      catch (e) { errs.push(PROVIDERS[k].label + ": " + e.message); }
    }
    throw new Error(errs.join(" | "));
  }

  function renderRow(i, item) {
    let tr = rows.children[i];
    if (!tr) { tr = document.createElement("tr"); rows.appendChild(tr); }
    tr.innerHTML = "";
    const cells = [String(i + 1), item.original, item.short, item.error || (item.short ? "ok" : "...")];
    cells.forEach((text, idx) => {
      const td = document.createElement("td");
      if (idx === 1) td.className = "orig";
      if (idx === 2 && item.short) {
        const a = document.createElement("a");
        a.href = item.short; a.textContent = item.short; a.target = "_blank"; a.rel = "noopener";
        td.appendChild(a);
      } else {
        td.textContent = text;
      }
      if (idx === 3) td.className = item.short ? "ok" : (item.error ? "err" : "");
      tr.appendChild(td);
    });
  }

  async function run() {
    const urls = parseInput();
    if (!urls.length) { statusEl.textContent = "Tidak ada URL untuk diproses."; return; }

    data = urls.map((u) => ({ original: u, short: "", error: "" }));
    rows.innerHTML = "";
    results.hidden = false;
    data.forEach((d, i) => renderRow(i, d));

    stopped = false;
    startBtn.disabled = true; stopBtn.disabled = false;
    bar.hidden = false; bar.max = urls.length; bar.value = 0;

    const delay = Math.max(0, parseInt(delayEl.value, 10) || 0);
    let ok = 0, fail = 0;

    for (let i = 0; i < urls.length; i++) {
      if (stopped) break;
      statusEl.textContent = `Memproses ${i + 1} / ${urls.length}...`;
      try {
        data[i].short = await shorten(provider.value, urls[i]);
        ok++;
      } catch (e) {
        data[i].error = e.message;
        fail++;
      }
      renderRow(i, data[i]);
      bar.value = i + 1;
      if (i < urls.length - 1) await sleep(delay);
    }

    statusEl.textContent = (stopped ? "Dihentikan. " : "Selesai. ") + `Berhasil: ${ok}, gagal: ${fail}.`;
    startBtn.disabled = false; stopBtn.disabled = true;
  }

  function csvEscape(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }

  $("csv").addEventListener("click", () => {
    const lines = ["original_url,short_url,status"];
    data.forEach((d) => lines.push([d.original, d.short, d.short ? "ok" : "error: " + d.error].map(csvEscape).join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "shortened.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $("copy").addEventListener("click", async () => {
    const text = data.filter((d) => d.short).map((d) => d.short).join("\n");
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = "Short URL disalin ke clipboard.";
    } catch {
      statusEl.textContent = "Gagal menyalin; salin manual dari tabel.";
    }
  });

  startBtn.addEventListener("click", run);
  stopBtn.addEventListener("click", () => { stopped = true; });
})();
</script>
</body>
</html>
